name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "google-services.json is in the repo already"
          # Use debug signing (no secrets needed)
          echo "RELEASE_STORE_FILE=debug.keystore" > local.properties
          echo "RELEASE_STORE_PASSWORD=android" >> local.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> local.properties
          echo "RELEASE_KEY_PASSWORD=android" >> local.properties

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web-ui dependencies
        run: |
          cd web-ui
          npm install
          cd ..

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk
